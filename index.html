<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7cc7f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Appel Tycoon: bouw je eigen 3D appelfabriek, van klein schuurtje tot Appelplaneet.">
  <title>Appel Tycoon</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- versie:start (gegenereerd door tools/bump-version.mjs) -->
  <script type="importmap">
  {
    "imports": {
      "./js/audio.js": "./js/audio.js?v=879d04f36d",
      "./js/config.js": "./js/config.js?v=879d04f36d",
      "./js/economy.js": "./js/economy.js?v=879d04f36d",
      "./js/format.js": "./js/format.js?v=879d04f36d",
      "./js/goals.js": "./js/goals.js?v=879d04f36d",
      "./js/icons.js": "./js/icons.js?v=879d04f36d",
      "./js/main.js": "./js/main.js?v=879d04f36d",
      "./js/models.js": "./js/models.js?v=879d04f36d",
      "./js/tutorial.js": "./js/tutorial.js?v=879d04f36d",
      "./js/ui.js": "./js/ui.js?v=879d04f36d",
      "./js/world.js": "./js/world.js?v=879d04f36d",
      "./vendor/three.module.min.js": "./vendor/three.module.min.js?v=879d04f36d"
    }
  }
  </script>
  <script>window.APP_VERSION = '879d04f36d';</script>
  <!-- versie:end -->
  <link rel="stylesheet" href="css/style.css?v=879d04f36d">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="fx"></div>

  <header id="hud">
    <div class="money-card">
      <div class="coin">€</div>
      <div>
        <div id="money" class="money">€0</div>
        <div id="income" class="income">+€0/s</div>
      </div>
    </div>
    <div class="hud-center">
      <div id="goal" class="goal">
        <div class="goal-icon" data-icon="target"></div>
        <div class="goal-body">
          <div id="goal-text"></div>
          <div class="bar"><i id="goal-bar"></i></div>
        </div>
        <button id="goal-claim" class="btn green small hidden">Claim</button>
      </div>

      <div id="tutorial" class="tutorial hidden">
        <div class="tut-head"><span data-icon="sparkle"></span><span id="tut-step"></span></div>
        <div id="tut-text"></div>
        <button id="tut-btn" class="btn green small hidden"></button>
      </div>

    </div>
    <div class="hud-right">
      <button id="btn-investors" class="chip" aria-label="Investeerders"><span class="gold-ic" data-icon="star"></span><b id="inv-count">0</b></button>
      <button id="btn-settings" class="round" aria-label="Instellingen"><span data-icon="gear"></span></button>
    </div>
  </header>

  <nav id="dock">
    <button data-open="stations"><span data-icon="factory"></span><small>Fabriek</small></button>
    <button data-open="chain"><span data-icon="chart"></span><small>Keten</small><i class="badge hidden"></i></button>
    <button data-open="research"><span data-icon="up"></span><small>Upgrades</small><i class="badge hidden"></i></button>
    <button data-open="expand"><span data-icon="expand"></span><small>Uitbreiden</small><i class="badge hidden"></i></button>
  </nav>

  <section id="sheet" class="sheet hidden"></section>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts"></div>

  <div id="loading">
    <img class="logo" src="icon.svg" alt="">
    <div>Appel Tycoon</div>
    <small>fabriek wordt gebouwd…</small>
  </div>

  <script type="module" src="js/main.js?v=879d04f36d"></script>
</body>
</html>
